<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Javaanse Datum Calculator — index5</title>
    <style>
:root{color-scheme:light;--brown:#69431f;--brown-dark:#4a2e14;--line:#d9c6a9;--paper:#fffdf8;--bg:#f3efe6;--text:#352b21;--muted:#74695d;--red:#bd2929}
*{box-sizing:border-box}
body{margin:0;padding:clamp(8px,3vw,28px);background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto}
header{text-align:center;margin:0 0 18px}
h1{font-size:clamp(1.55rem,5vw,2.2rem);margin:0;color:var(--brown)}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:.95rem}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #38230d12;padding:clamp(12px,3vw,22px)}
.date-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{min-width:0}
label{display:block;margin:0 0 6px;color:var(--muted);font-size:.9rem;font-weight:650}
input{width:100%;min-width:0;min-height:46px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font:inherit}
button{min-height:46px;padding:9px 14px;border:0;border-radius:9px;background:var(--brown);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:background-color .18s ease,transform .18s ease}
button:hover{background:var(--brown-dark)}
button:active{transform:translateY(1px)}
button:disabled{background:#aaa;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible{outline:3px solid #d9a92e;outline-offset:2px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:9px;margin-top:14px}
.actions .secondary{background:#f2eadc;color:var(--brown-dark);border:1px solid var(--line)}
.actions .secondary:hover{background:#e9dcc7}
#resultaat{min-height:64px;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--text);text-align:left;white-space:pre-line;overflow-wrap:anywhere;line-height:1.6}
#resultaat:empty{display:none}
#resultaat.fout{border-color:var(--red);color:var(--red);font-weight:700}
.footer{margin:14px 0 0;color:var(--muted);font-size:.82rem;text-align:center}
.loading{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
@media(max-width:560px){.date-fields{grid-template-columns:1fr;gap:9px}.actions{grid-template-columns:1fr}#resultaat{padding:12px;font-size:.95rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<header>
<h1>Javaanse Datum Calculator</h1>
<p class="subtitle">Javaanse dag-, jaar- en pasaranberekening</p>
</header>
<section class="card" aria-label="Javaanse datum berekenen">
<div class="date-fields">
<div class="field">
<label for="dag">Dag</label>
<input type="number" id="dag" placeholder="Bijv. 15" min="1" max="31" inputmode="numeric" title="Voer de dag in (1-31)">
</div>
<div class="field">
<label for="maand">Maand</label>
<input type="number" id="maand" placeholder="Bijv. 7" min="1" max="12" inputmode="numeric" title="Voer de maand in (1-12)">
</div>
<div class="field">
<label for="jaar">Jaar</label>
<input type="number" id="jaar" placeholder="Bijv. 1990" min="1800" max="2200" inputmode="numeric" title="Voer het jaar in (1800-2200)">
</div>
</div>
<div class="actions">
<button type="button" onclick="bereken()">Bereken</button>
<button class="secondary" type="button" onclick="vulHuidigeDatum()">Huidige datum</button>
<button class="secondary" type="button" onclick="exporteerNaarPDF()">Exporteer naar PDF</button>
</div>
<div id="resultaat" role="status" aria-live="polite" aria-atomic="true">Resultaat verschijnt hier</div>
</section>
<footer class="footer">© 2025 Javaanse Datum Calculator · Kedjawen Javaweg</footer>
</main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const elements = {
            dag: document.getElementById('dag'),
            maand: document.getElementById('maand'),
            jaar: document.getElementById('jaar'),
            resultaat: document.getElementById('resultaat'),
            berekenKnop: document.querySelector('button[onclick="bereken()"]')
        };

        const MS_PER_DAY = 1000 * 60 * 60 * 24;
        const referentieDatumUTC = Date.UTC(2023, 7, 5);
        const referentieJavaansJaar = 6449;
        const javaansJaarLengte = 355;

        function datumNaarUTC(jaar, maand, dag) {
            return Date.UTC(jaar, maand - 1, dag);
        }

        function dagVerschilUTC(datumUTC, referentieUTC) {
            return Math.round((datumUTC - referentieUTC) / MS_PER_DAY);
        }

        const dagWaarden = {
            "Zondag": 5, "Maandag": 4, "Dinsdag": 3,
            "Woensdag": 7, "Donderdag": 8, "Vrijdag": 6, "Zaterdag": 9
        };
        const pasaranWaarden = {
            "Kliwon": 8, "Legi": 5, "Paing": 9, "Pon": 7, "Wage": 4
        };
        const pawetonTeksten = {
            1: "Hono", 2: "Noto", 3: "Tjoro", 4: "Rosoko", 5: "Koyo",
            6: "Doko", 7: "Toko", 8: "Soworo", 9: "Wotjo", 10: "Lomono",
            11: "Podho", 12: "Dhoho", 13: "Djopo", 14: "Joho", 15: "Njoto",
            16: "Monggo", 17: "Gopoho", 18: "Bohoso", 19: "Thotoko", 20: "Ngotoko"
        };

        const dagNamenUitkomst = {
            "Zondag": "dotho", "Maandag": "goto", "Dinsdag": "goso",
            "Woensdag": "joso", "Donderdag": "joho", "Vrijdag": "hodo", "Zaterdag": "woro"
        };

        const pechDagMapping = {
            "dotho": {
                "Wage": { dag: "hodo", pasaran: "Legi" },
                "Legi": { dag: "woro", pasaran: "Paing" },
                "Kliwon": { dag: "goso", pasaran: "Kliwon" },
                "Pon": { dag: "goto", pasaran: "Wage" },
                "Paing": { dag: "joso", pasaran: "Kliwon" }
            },
            "goso": {
                "Legi": { dag: "joho", pasaran: "Kliwon" },
                "Pon": { dag: "woro", pasaran: "Paing" },
                "Kliwon": { dag: "dotho", pasaran: "Pon" },
                "Wage": { dag: "joso", pasaran: "Wage" },
                "Paing": { dag: "goto", pasaran: "Wage" }
            },
            "goto": {
                "Kliwon": { dag: "goto", pasaran: "Wage" },
                "Paing": { dag: "goso", pasaran: "Kliwon" },
                "Wage": { dag: "joho", pasaran: "Kliwon" },
                "Legi": { dag: "hodo", pasaran: "Legi" },
                "Pon": { dag: "dotho", pasaran: "Pon" }
            },
            "hodo": {
                "Wage": { dag: "woro", pasaran: "Paing" },
                "Legi": { dag: "dotho", pasaran: "Pon" },
                "Pon": { dag: "goso", pasaran: "Kliwon" },
                "Kliwon": { dag: "joso", pasaran: "Legi" },
                "Paing": { dag: "joho", pasaran: "Paing" }
            },
            "joho": {
                "Pon": { dag: "joho", pasaran: "Paing" },
                "Kliwon": { dag: "hodo", pasaran: "Pon" },
                "Paing": { dag: "woro", pasaran: "Wage" },
                "Wage": { dag: "goto", pasaran: "Wage" },
                "Legi": { dag: "goso", pasaran: "Kliwon" }
            },
            "joso": {
                "Paing": { dag: "hodo", pasaran: "Pon" },
                "Legi": { dag: "goto", pasaran: "Wage" },
                "Wage": { dag: "dotho", pasaran: "Pon" },
                "Pon": { dag: "joso", pasaran: "Legi" },
                "Kliwon": { dag: "joho", pasaran: "Paing" }
            },
            "woro": {
                "Legi": { dag: "joso", pasaran: "Legi" },
                "Kliwon": { dag: "woro", pasaran: "Wage" },
                "Paing": { dag: "dotho", pasaran: "Kliwon" },
                "Wage": { dag: "goso", pasaran: "Kliwon" },
                "Pon": { dag: "hodo", pasaran: "Pon" }
            }
        };

        const kalenderCyclus = [
            {dag: "goso", pasaran: "kliwon"},
            {dag: "joso", pasaran: "legi"},
            {dag: "joho", pasaran: "Paing"},
            {dag: "hodo", pasaran: "pon"},
            {dag: "woro", pasaran: "wage"},
            {dag: "dotho", pasaran: "kliwon"},
            {dag: "goto", pasaran: "legi"},
            {dag: "goso", pasaran: "Paing"},
            {dag: "joso", pasaran: "pon"},
            {dag: "joho", pasaran: "wage"},
            {dag: "hodo", pasaran: "kliwon"},
            {dag: "woro", pasaran: "legi"},
            {dag: "dotho", pasaran: "Paing"},
            {dag: "goto", pasaran: "pon"},
            {dag: "goso", pasaran: "wage"},
            {dag: "joso", pasaran: "kliwon"},
            {dag: "joho", pasaran: "legi"},
            {dag: "hodo", pasaran: "Paing"},
            {dag: "woro", pasaran: "pon"},
            {dag: "dotho", pasaran: "wage"},
            {dag: "goto", pasaran: "kliwon"},
            {dag: "goso", pasaran: "legi"},
            {dag: "joso", pasaran: "Paing"},
            {dag: "joho", pasaran: "pon"},
            {dag: "hodo", pasaran: "wage"},
            {dag: "woro", pasaran: "kliwon"},
            {dag: "dotho", pasaran: "legi"},
            {dag: "goto", pasaran: "Paing"},
            {dag: "goso", pasaran: "pon"},
            {dag: "joso", pasaran: "wage"},
            {dag: "joho", pasaran: "kliwon"},
            {dag: "hodo", pasaran: "legi"},
            {dag: "woro", pasaran: "Paing"},
            {dag: "dotho", pasaran: "pon"},
            {dag: "goto", pasaran: "wage"}
        ];

        class ResultaatCache {
            static cache = new Map();
            static cacheGrootte = 50;
            static getSleutel(dag, maand, jaar) { return `${dag}-${maand}-${jaar}`; }
            static get(sleutel) { return this.cache.get(sleutel); }
            static set(sleutel, resultaat) {
                if (this.cache.size >= this.cacheGrootte) {
                    this.cache.delete(this.cache.keys().next().value);
                }
                this.cache.set(sleutel, resultaat);
            }
        }

        function vulHuidigeDatum() {
            const nu = new Date();
            elements.dag.value = nu.getDate();
            elements.maand.value = nu.getMonth() + 1;
            elements.jaar.value = nu.getFullYear();
        }

        function exporteerNaarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const resultaat = elements.resultaat.textContent;
            const datumInput = `${elements.dag.value}-${elements.maand.value}-${elements.jaar.value}`;
            doc.setFontSize(16);
            doc.text(`Javaanse Datum Calculator - ${datumInput}`, 10, 10);
            doc.setFontSize(10);
            doc.text(doc.splitTextToSize(resultaat, 180), 10, 20);
            doc.save(`javaanse_datum_${datumInput.replace(/\//g, '-')}.pdf`);
        }

        function vindKalenderIndex(dag, pasaran) {
            const genormaliseerdePasaran = pasaran.toLowerCase() === "paing" ? "Paing" : pasaran.toLowerCase();
            for (let i = 0; i < kalenderCyclus.length; i++) {
                if (kalenderCyclus[i].dag === dag && kalenderCyclus[i].pasaran === genormaliseerdePasaran) {
                    return i;
                }
            }
            return -1;
        }

        function berekenTangal(origineleDag, originelePasaran, pechDag, pechPasaran) {
            const vanIndex = vindKalenderIndex(origineleDag, originelePasaran);
            const naarIndex = vindKalenderIndex(pechDag, pechPasaran);
            if (vanIndex === -1 || naarIndex === -1) return null;
            let verschil = naarIndex - vanIndex;
            if (verschil < 0) verschil += 35;
            return verschil - 1;
        }

        function berekenSasi(pechDag, pechPasaran, origineleDag, originelePasaran) {
            const vanIndex = vindKalenderIndex(pechDag, pechPasaran);
            const naarIndex = vindKalenderIndex(origineleDag, originelePasaran);
            if (vanIndex === -1 || naarIndex === -1) return null;
            let verschil = naarIndex - vanIndex;
            if (verschil < 0) verschil += 35;
            let sasi = verschil - 1;
            if (sasi > 9) {
                sasi = sasi % 9;
                if (sasi === 0) sasi = 9;
            }
            return sasi;
        }

        function berekenPechDag(dagNaam, pasaranNaam) {
            const mapping = pechDagMapping[dagNaam];
            if (mapping && mapping[pasaranNaam]) return mapping[pasaranNaam];
            return null;
        }

        function valideerDatum(dag, maand, jaar) {
            if (isNaN(dag) || isNaN(maand) || isNaN(jaar)) {
                return { geldig: false, fout: "Vul alle velden in met geldige nummers." };
            }
            if (dag < 1 || dag > 31) return { geldig: false, fout: "Dag moet tussen 1 en 31 zijn." };
            if (maand < 1 || maand > 12) return { geldig: false, fout: "Maand moet tussen 1 en 12 zijn." };
            if (jaar < 1800 || jaar > 2200) return { geldig: false, fout: "Jaar moet tussen 1800 en 2200 zijn." };
            const d = new Date(Date.UTC(jaar, maand - 1, dag));
            if (d.getUTCDate() !== dag || d.getUTCMonth() !== maand - 1 || d.getUTCFullYear() !== jaar) {
                return { geldig: false, fout: "Ongeldige datum. Controleer of de dag bestaat in deze maand." };
            }
            return { geldig: true };
        }

        function bepaalJavaansJaar(datumUTC) {
            const dagenVerschil = dagVerschilUTC(datumUTC, referentieDatumUTC);
            // Math.floor werkt ook voor negatieve dagverschillen: vóór de referentiedatum
            // valt de datum in het vorige Javaanse jaar zonder extra jaarcorrectie.
            const jaarVerschil = Math.floor(dagenVerschil / javaansJaarLengte);
            return referentieJavaansJaar + jaarVerschil;
        }

        async function bereken() {
            const originalText = elements.berekenKnop.textContent;
            elements.resultaat.classList.remove('fout');
            elements.berekenKnop.textContent = "Berekenen...";
            elements.berekenKnop.disabled = true;
            elements.berekenKnop.classList.add('loading');

            try {
                await new Promise(resolve => setTimeout(resolve, 300));

                const dag = parseInt(elements.dag.value);
                const maand = parseInt(elements.maand.value);
                const jaar = parseInt(elements.jaar.value);

                const sleutel = ResultaatCache.getSleutel(dag, maand, jaar);
                const gecachedResultaat = ResultaatCache.get(sleutel);
                if (gecachedResultaat) {
                    elements.resultaat.textContent = gecachedResultaat;
                    return;
                }

                const validatie = valideerDatum(dag, maand, jaar);
                if (!validatie.geldig) {
                    elements.resultaat.textContent = validatie.fout;
                    elements.resultaat.classList.add('fout');
                    return;
                }

                const datumUTC = datumNaarUTC(jaar, maand, dag);
                const javaansJaar = bepaalJavaansJaar(datumUTC);
                const [javaanseMaand, dagVanDeMaand] = bepaalJavaanseMaandEnDag(datumUTC);
                const pasaran = bepaalPasaran(datumUTC);
                const dagVanDeWeek = bepaalDagVanDeWeek(datumUTC);
                const dagWaarde = dagWaarden[dagVanDeWeek] || 0;
                const pasaranWaarde = pasaranWaarden[pasaran] || 0;
                const totaleWaarde = dagWaarde + pasaranWaarde;
                const ligging = bepaalLigging(totaleWaarde);
                const overdagTijden = berekenKerkdienstTijden(dagWaarde, 'overdag');
                const avondTijden = berekenKerkdienstTijden(pasaranWaarde, 'avond');
                const paweton = berekenPaweton(dagVanDeMaand, pasaranWaarde, dagWaarde, totaleWaarde);
                const kabedjan = berekenKabedjan(dagVanDeMaand, pasaran, dagVanDeWeek);
                const dagNaamUitkomst = dagNamenUitkomst[dagVanDeWeek] || dagVanDeWeek;
                const pechDag = berekenPechDag(dagNaamUitkomst, pasaran);
                const kabedjanApes = berekenPechDag(kabedjan.dino, kabedjan.pasaran);

                let resultaat = `Koto: ${javaansJaar}
Sasi: ${javaanseMaand}
Tanggal: ${dagVanDeMaand}
Pasaran: ${pasaran}
Dino: ${dagNaamUitkomst}
Waarde van de Dag: ${dagWaarde}
Waarde van de Pasaran: ${pasaranWaarde}
Totale Waarde: ${totaleWaarde}
Ligging: ${ligging}

Kerkdiensttijden (overdag): ${overdagTijden.join(', ')}
Kerkdiensttijden (avond): ${avondTijden.join(', ')}

${paweton}

Kabedjan:
Dino: ${kabedjan.dino}
Pasaran: ${kabedjan.pasaran}
Dagwaarde: ${kabedjan.dagWaarde}
Pasaranwaarde: ${kabedjan.pasaranWaarde}
Totale waarde: ${kabedjan.totaleWaarde}

Kabedjan-waarden:
${kabedjan.waarden}`;

                if (kabedjanApes) {
                    resultaat += `\n\nKabedjan Apes: ${kabedjan.dino} ${kabedjan.pasaran} = ${kabedjanApes.dag} ${kabedjanApes.pasaran}`;
                    const kabedjanTangal = berekenTangal(kabedjan.dino, kabedjan.pasaran, kabedjanApes.dag, kabedjanApes.pasaran);
                    const kabedjanSasi = berekenSasi(kabedjanApes.dag, kabedjanApes.pasaran, kabedjan.dino, kabedjan.pasaran);
                    if (kabedjanTangal !== null && kabedjanSasi !== null) {
                        resultaat += `\nKabedjan Siraman:\nTangal: ${kabedjanTangal}\nSasi: ${kabedjanSasi}`;
                    }
                }

                if (pechDag) {
                    resultaat += `\n\nApes: ${dagNaamUitkomst} ${pasaran} = ${pechDag.dag} ${pechDag.pasaran}`;
                    const tangal = berekenTangal(dagNaamUitkomst, pasaran, pechDag.dag, pechDag.pasaran);
                    const sasi = berekenSasi(pechDag.dag, pechDag.pasaran, dagNaamUitkomst, pasaran);
                    if (tangal !== null && sasi !== null) {
                        resultaat += `\n\nSiraman:\nTangal: ${tangal}\nSasi: ${sasi}`;
                    }
                }

                elements.resultaat.textContent = resultaat;
                ResultaatCache.set(sleutel, resultaat);

            } catch (error) {
                console.error("Berekenfout:", error);
                let foutmelding = "Er is een fout opgetreden bij het berekenen. Probeer opnieuw.";
                if (error.message.includes("Invalid date")) {
                    foutmelding = "Ongeldige datum. Controleer de ingevoerde waarden.";
                } else if (error.message.includes("RangeError")) {
                    foutmelding = "De datum valt buiten het bereik van de calculator.";
                }
                elements.resultaat.textContent = foutmelding;
                elements.resultaat.classList.add('fout');
            } finally {
                elements.berekenKnop.textContent = originalText;
                elements.berekenKnop.disabled = false;
                elements.berekenKnop.classList.remove('loading');
            }
        }

        elements.dag.addEventListener('blur', function() {
            if (this.value < 1) this.value = 1;
            if (this.value > 31) this.value = 31;
        });
        elements.maand.addEventListener('blur', function() {
            if (this.value < 1) this.value = 1;
            if (this.value > 12) this.value = 12;
        });
        elements.jaar.addEventListener('blur', function() {
            if (this.value < 1800) this.value = 1800;
            if (this.value > 2200) this.value = 2200;
        });

        function bepaalJavaanseMaandEnDag(datumUTC) {
            const dagenVerschil = dagVerschilUTC(datumUTC, referentieDatumUTC);
            let dagenInHuidigJaar = dagenVerschil % javaansJaarLengte;
            if (dagenInHuidigJaar < 0) dagenInHuidigJaar += javaansJaarLengte;
            const javaanseMaanden = [
                ["Koso Soworo (1)", 36], ["Pobo (2)", 35], ["Mono (3)", 36],
                ["Somo (4)", 35], ["Poko (5)", 36], ["Bowoko (6)", 35],
                ["Pono (7)", 36], ["Woko (8)", 35], ["Sono (9)", 36], ["Noto (10)", 35]
            ];
            for (const [maandNaam, dagenInMaand] of javaanseMaanden) {
                if (dagenInHuidigJaar < dagenInMaand) return [maandNaam, dagenInHuidigJaar + 1];
                dagenInHuidigJaar -= dagenInMaand;
            }
            return ["Onbekend", 0];
        }

        function bepaalPasaran(datumUTC) {
            const referentiePasaranUTC = Date.UTC(2000, 0, 1);
            const dagenVerschil = dagVerschilUTC(datumUTC, referentiePasaranUTC);
            const pasaranIndex = (dagenVerschil % 5 + 5) % 5;
            return ["Legi", "Paing", "Pon", "Wage", "Kliwon"][pasaranIndex];
        }

        function bepaalDagVanDeWeek(datumUTC) {
            return ["Zondag", "Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag"][new Date(datumUTC).getUTCDay()];
        }

        function bepaalLigging(totaleWaarde) {
            return ["Noord", "Zuid", "Oost", "West"][(totaleWaarde - 1) % 4];
        }

        function berekenMinuten(uren) {
            return (uren[0] + uren[Math.floor(uren.length / 2)] + uren[uren.length - 1]) % 60;
        }

        function formatTijd12Uur(uur, minuten) {
            uur = uur % 12 || 12;
            return `${String(uur).padStart(2, '0')}:${String(minuten).padStart(2, '0')}`;
        }

        function berekenKerkdienstTijden(waarde, type) {
            const uren = [];
            for (let i = 0; i < 7; i++) {
                let uur = (waarde + i) % 24;
                if (type === 'avond' && uur >= 12) uur -= 12;
                uren.push(uur % 12 || 12);
            }
            const minuten = berekenMinuten(uren);
            return uren.map(uur => formatTijd12Uur(uur, minuten));
        }

        function berekenPaweton(dagVanDeMaand, pasaranWaarde, dagWaarde, totaleWaarde) {
            const maakPositief = (w) => (w < 0 ? -w : w);
            const verminderMet20 = (w) => (w > 20 ? w - 20 : w);
            const krijgTekst = (w) => pawetonTeksten[w] || "Standaard";

            let e = verminderMet20(maakPositief(dagVanDeMaand - dagWaarde));
            if (e === 0) e = 1;
            let t = verminderMet20(maakPositief(dagVanDeMaand - pasaranWaarde));
            if (t === 0) t = 1;
            let d = verminderMet20(maakPositief(dagVanDeMaand));
            let v = verminderMet20(maakPositief(totaleWaarde));

            return `Paweton:\n${e} - ${krijgTekst(e)}\n${t} - ${krijgTekst(t)}\n${d} - ${krijgTekst(d)}\n${v} - ${krijgTekst(v)}`;
        }

        function berekenKabedjan(dagVanDeMaand, pasaran, dagVanDeWeek) {
            const dagenVanDeWeek = ["Zondag", "Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag"];
            const pasaranCyclus = ["Legi", "Paing", "Pon", "Wage", "Kliwon"];

            const huidigeDagIndex = dagenVanDeWeek.indexOf(dagVanDeWeek);
            const kabedjanDag = dagenVanDeWeek[(huidigeDagIndex + 3) % 7];

            const huidigePasaranIndex = pasaranCyclus.indexOf(pasaran);
            const kabedjanPasaran = pasaranCyclus[(huidigePasaranIndex - 1 + 5) % 5];

            const kabedjanDagWaarde = dagWaarden[kabedjanDag] || 0;
            const kabedjanPasaranWaarde = pasaranWaarden[kabedjanPasaran] || 0;
            const kabedjanTotaleWaarde = kabedjanDagWaarde + kabedjanPasaranWaarde;
            const kabedjanGetal = waarde => Math.abs(waarde) % 20 || 20;

            const waarden = [
                kabedjanGetal(dagVanDeMaand - kabedjanDagWaarde),
                kabedjanGetal(dagVanDeMaand - kabedjanPasaranWaarde),
                kabedjanGetal(dagVanDeMaand),
                kabedjanGetal(kabedjanTotaleWaarde)
            ];

            const kabedjanWaarden = waarden
                .map((waarde, index) => `${index + 1}: ${waarde} - ${pawetonTeksten[waarde] || "Onbekend"}`)
                .join("\n");

            return {
                dino: dagNamenUitkomst[kabedjanDag] || kabedjanDag,
                pasaran: kabedjanPasaran,
                dagWaarde: kabedjanDagWaarde,
                pasaranWaarde: kabedjanPasaranWaarde,
                totaleWaarde: kabedjanTotaleWaarde,
                waarden: kabedjanWaarden
            };
        }

        [elements.dag, elements.maand, elements.jaar].forEach(el => {
            el.addEventListener('keypress', (e) => { if (e.key === 'Enter') bereken(); });
        });
    </script>
